<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Облако Пользователя</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/class.css">
</head>

<body>
<header>
    <div>
        <button class="logout-btn">
            <img src="img/logout-svgrepo-com.svg">
        </button>
    </div>
    <div class="clickable-container">
        <h4 class="font">Пользователь</h4>
        <h6 class="tint-font">Уровень: Стандартный</h6>
    </div>
</header>

<main>
    <div class="file-card-bg">
        <div>
            <h4 class="font">file-sample.txt</h4>
            <h6 class="tint-font">300 KB</h6>
        </div>
        <div>
            <img src="img/extension/txt.svg">
        </div>
    </div>

    <div class="file-card-bg">
        <div>
            <h4 class="font">photo-sample.png</h4>
            <h6 class="tint-font">4500 KB</h6>
        </div>
        <div class="file-card-img-holder">
            <img src="img/extension/png.svg">
        </div>
    </div>
</main>

<div>
    <button class="add-fab-bg">
        <img class="add-fab-fg" src="img/plus-svgrepo-com.svg">
    </button>
</div>

</body>
